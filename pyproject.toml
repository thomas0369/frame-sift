[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "frame-sift"
version = "0.1.0"
description = "Extrahiert einzigartige Frames aus YouTube-Videos für Vision-Analyse mit Claude Code"
requires-python = ">=3.11"
dependencies = [
    "yt-dlp>=2024.1.0",
    "imagehash>=4.3.1",
    "Pillow>=10.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
